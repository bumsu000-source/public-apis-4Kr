<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>환율 대시보드 - 1단계</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>오늘의 원/달러 환율</h1>
    <p class="subtitle">1단계: API 연동 확인용 화면</p>

    <section class="rate-card" id="rate-card">
      <p class="state" id="state-text">불러오는 중...</p>
      <p class="rate-value" id="rate-value" hidden>-</p>
      <p class="rate-meta" id="rate-meta" hidden></p>
    </section>

    <section class="fields-card" id="fields-card" hidden>
      <h2>응답에 들어있는 항목</h2>
      <ul id="fields-list"></ul>
    </section>

    <button id="reload-btn" type="button">다시 불러오기</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
